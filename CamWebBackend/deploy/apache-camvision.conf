# Apache virtual host for the CamVision web UI: HTTPS, and everything is passed to the backend (which serves the web UI and the API).
#
#   sudo a2enmod proxy proxy_http headers ssl rewrite
#   sudo cp deploy/apache-camvision.conf /etc/apache2/sites-available/camvision.conf
#   sudo a2ensite camvision && sudo systemctl reload apache2
#
# Replace cam.example.com and the certificate (Let's Encrypt: sudo certbot --apache -d cam.example.com).
# For a name that only works in your home network, a certificate of your own CA (or Tailscale's HTTPS certificates) does the same.

<VirtualHost *:80>
    ServerName cam.example.com
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName cam.example.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/cam.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/cam.example.com/privkey.pem

    # The backend needs the original host (the login checks it against the Origin of a request) and to know, that the visitor uses HTTPS (the login
    # cookie is then "Secure"). mod_proxy sends X-Forwarded-For and X-Forwarded-Host itself, but not the protocol.
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    ProxyPass        / http://127.0.0.1:3001/
    ProxyPassReverse / http://127.0.0.1:3001/

    # The live stream is a response, which never ends: no timeout for it.
    ProxyTimeout 3600

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"
    Header always set Strict-Transport-Security "max-age=31536000"
</VirtualHost>

# Under a path of an existing site (https://example.com/cam/) does not work with this web UI: it expects to be at the root of its host name.
# Use a (sub)domain for it.
